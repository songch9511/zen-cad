milestone_id: 002_nema17_mount_plate
workflow: /spec-to-cad
prohibited_generation:
  - none; this final demo contains only one custom design-specific part
custom_parts:
  - part_id: C-001
    name: NEMA17 mount plate
    purpose: mount a NEMA17 motor face to a rectangular frame or test fixture
    interfaces:
      - centered 22 mm pilot bore
      - four 3.4 mm NEMA17 face mounting holes on 31 mm square pattern
      - four 4.5 mm frame mounting holes at +/-24 mm
    dimensions: 60 x 60 x 4 mm
    material_assumption: aluminum or rigid printed plastic for geometry demo only
    validation_criteria:
      - STEP and STL exports exist and are non-empty
      - OCP can load the exported STEP file
      - source parameters match the requirements brief
